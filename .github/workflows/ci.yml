name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  package-linux:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deb@3.8.0,cargo-generate-rpm@0.21.1
      - run: cargo deb -p lunge-gui -- --locked
      # Reuses the release binary cargo-deb just built.
      - run: cargo generate-rpm -p crates/lunge-gui
      # Install each package on a clean distro and confirm the window opens
      # (exit 124 = still running when timeout fired), then uninstall cleanly.
      # Catches runtime (dlopen) libraries missing from the package metadata.
      - name: Smoke-test .deb on clean Ubuntu
        run: |
          docker run --rm -v "$PWD/target/debian:/pkgs:ro" ubuntu:24.04 bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends /pkgs/*.deb
            apt-get install -y -qq --no-install-recommends xvfb xauth
            rc=0; xvfb-run -a timeout 5 lunge || rc=$?
            [ "$rc" -eq 124 ] || { echo "lunge exited early ($rc)"; exit 1; }
            apt-get remove -y -qq lunge
            [ ! -e /usr/bin/lunge ]'
      - name: Smoke-test .rpm on clean Fedora
        run: |
          docker run --rm -v "$PWD/target/generate-rpm:/pkgs:ro" fedora:43 bash -euc '
            dnf install -y -q /pkgs/*.rpm
            dnf install -y -q xorg-x11-server-Xvfb
            Xvfb :99 & sleep 2
            rc=0; DISPLAY=:99 timeout 5 lunge || rc=$?
            [ "$rc" -eq 124 ] || { echo "lunge exited early ($rc)"; exit 1; }
            dnf remove -y -q lunge
            [ ! -e /usr/bin/lunge ]'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
          if-no-files-found: error
          # Short retention: these are per-commit builds, not releases.
          retention-days: 14
