[workspace]
members = ["crates/lunge-core", "crates/lunge-gui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["High Trail Studios"]
repository = "https://github.com/High-Trail-Studios/lunge"

[workspace.dependencies]
lunge-core = { path = "crates/lunge-core", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
time = { version = "0.3.55", features = ["parsing"] }
tempfile = "3.27.0"
dark-light = "3.0.0"
# glow (OpenGL) instead of the default wgpu renderer: a session list doesn't
# need wgpu, and glow keeps the binary and build noticeably smaller.
eframe = { version = "0.37.0", default-features = false, features = [
  "accesskit",
  # Copy buttons and copying selected text (e.g. a login URL).
  "clipboard",
  "default_fonts",
  "glow",
  # Remembers zoom, theme, and window size (no AWS data) between launches.
  "persistence",
  "wayland",
  "x11",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# cargo-generate-rpm packages the binary as-is, so strip it at build time.
strip = true
